<script type="text/plain" class="code" data-id="p2" data-title="2. Simple Calculator (Flutter)" data-file="calculator_main.dart" data-note="Use as lib/main.dart">
import 'package:flutter/material.dart';

void main() => runApp(const MaterialApp(
      debugShowCheckedModeBanner: false,
      home: Calculator(),
    ));

class Calculator extends StatefulWidget {
  const Calculator({super.key});
  @override
  State<Calculator> createState() => _CalculatorState();
}

class _CalculatorState extends State<Calculator> {
  String display = '0';
  double? first;
  String? op;
  bool fresh = true;

  void press(String b) {
    setState(() {
      if ('0123456789.'.contains(b)) {
        if (fresh) {
          display = b == '.' ? '0.' : b;
          fresh = false;
        } else if (!(b == '.' && display.contains('.'))) {
          display += b;
        }
      } else if (b == 'C') {
        display = '0';
        first = null;
        op = null;
        fresh = true;
      } else if (b == '=') {
        if (first != null && op != null) {
          double second = double.tryParse(display) ?? 0;
          display = format(calculate(first!, second, op!));
          first = null;
          op = null;
          fresh = true;
        }
      } else {
        first = double.tryParse(display) ?? 0;
        op = b;
        fresh = true;
      }
    });
  }

  double calculate(double a, double b, String op) {
    switch (op) {
      case '+':
        return a + b;
      case '-':
        return a - b;
      case 'x':
        return a * b;
      default:
        return a / b;
    }
  }

  String format(double v) {
    if (v.isNaN || v.isInfinite) return 'Error';
    return v % 1 == 0 ? v.toInt().toString() : v.toString();
  }

  @override
  Widget build(BuildContext context) {
    const rows = [
      ['7', '8', '9', '/'],
      ['4', '5', '6', 'x'],
      ['1', '2', '3', '-'],
      ['C', '0', '.', '+'],
    ];
    return Scaffold(
      appBar: AppBar(title: const Text('Calculator')),
      body: Column(
        children: [
          Expanded(
            child: Container(
              alignment: Alignment.bottomRight,
              padding: const EdgeInsets.all(24),
              child: Text(display, style: const TextStyle(fontSize: 56)),
            ),
          ),
          for (final row in rows)
            Row(
              children: [
                for (final b in row)
                  Expanded(
                    child: Padding(
                      padding: const EdgeInsets.all(4),
                      child: ElevatedButton(
                        onPressed: () => press(b),
                        style: ElevatedButton.styleFrom(
                            padding: const EdgeInsets.symmetric(vertical: 22)),
                        child: Text(b, style: const TextStyle(fontSize: 24)),
                      ),
                    ),
                  ),
              ],
            ),
          Padding(
            padding: const EdgeInsets.fromLTRB(4, 0, 4, 12),
            child: SizedBox(
              width: double.infinity,
              child: ElevatedButton(
                onPressed: () => press('='),
                style: ElevatedButton.styleFrom(
                    padding: const EdgeInsets.symmetric(vertical: 22)),
                child: const Text('=', style: TextStyle(fontSize: 24)),
              ),
            ),
          ),
        ],
      ),
    );
  }
}
</script>

<script type="text/plain" class="code" data-id="p3" data-title="3. Restaurant Bill Split (Dart)" data-file="bill_split.dart" data-note="Console program: dart run bill_split.dart">
import 'dart:io';

void main() {
  stdout.write('Enter total bill amount: ');
  double bill = double.parse(stdin.readLineSync()!);

  stdout.write('Enter tip percentage: ');
  double tipPercent = double.parse(stdin.readLineSync()!);

  stdout.write('Enter number of people: ');
  int people = int.parse(stdin.readLineSync()!);

  double tip = bill * tipPercent / 100;
  double total = bill + tip;
  double perPerson = total / people;

  print('\n----- Bill Summary -----');
  print('Bill amount : ${bill.toStringAsFixed(2)}');
  print('Tip         : ${tip.toStringAsFixed(2)}');
  print('Total       : ${total.toStringAsFixed(2)}');
  print('Each person pays: ${perPerson.toStringAsFixed(2)}');
}
</script>

<script type="text/plain" class="code" data-id="p4" data-title="4. Strong Random Password Generator (Dart)" data-file="password_generator.dart" data-note="Console program: dart run password_generator.dart">
import 'dart:io';
import 'dart:math';

String generatePassword(int length) {
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const digits = '0123456789';
  const symbols = '!@#\$%^&*()-_=+[]{};:,.<>?';
  const all = lower + upper + digits + symbols;

  final rand = Random.secure();

  // Make sure at least one character of each type is present
  List<String> chars = [
    lower[rand.nextInt(lower.length)],
    upper[rand.nextInt(upper.length)],
    digits[rand.nextInt(digits.length)],
    symbols[rand.nextInt(symbols.length)],
  ];

  while (chars.length < length) {
    chars.add(all[rand.nextInt(all.length)]);
  }

  chars.shuffle(rand);
  return chars.join();
}

void main() {
  stdout.write('Enter password length (minimum 8): ');
  int length = int.parse(stdin.readLineSync()!);

  if (length < 8) {
    print('Password too short. Using length 8.');
    length = 8;
  }

  print('Generated password: ${generatePassword(length)}');
}
</script>

<!-- ============ 5. Cows and Bulls ============ -->
<script type="text/plain" class="code" data-id="p5" data-title="5. Cows and Bulls Game (Dart)" data-file="cows_and_bulls.dart" data-note="Console program: dart run cows_and_bulls.dart">
import 'dart:io';
import 'dart:math';

// Generates a 4-digit number with no repeated digits
String generateSecret() {
  final digits = '0123456789'.split('')..shuffle(Random());
  return digits.take(4).join();
}

void main() {
  final secret = generateSecret();
  int attempts = 0;

  print('Guess the 4-digit number (all digits different).');
  print('Bull = right digit, right place. Cow = right digit, wrong place.\n');

  while (true) {
    stdout.write('Your guess: ');
    String guess = stdin.readLineSync() ?? '';

    if (guess.length != 4 || int.tryParse(guess) == null) {
      print('Enter exactly 4 digits.');
      continue;
    }

    attempts++;
    int bulls = 0, cows = 0;

    for (int i = 0; i < 4; i++) {
      if (guess[i] == secret[i]) {
        bulls++;
      } else if (secret.contains(guess[i])) {
        cows++;
      }
    }

    print('Bulls: $bulls, Cows: $cows');

    if (bulls == 4) {
      print('You won in $attempts attempts! The number was $secret.');
      break;
    }
  }
}
</script>

<script type="text/plain" class="code" data-id="p6" data-title="6. Product List with Add to Cart (Flutter)" data-file="product_list_main.dart" data-note="Use as lib/main.dart (needs internet for images)">
import 'package:flutter/material.dart';

void main() => runApp(const MaterialApp(
      debugShowCheckedModeBanner: false,
      home: ProductList(),
    ));

class Product {
  final String name;
  final double price;
  final double rating;
  final String image;
  Product(this.name, this.price, this.rating, this.image);
}

class ProductList extends StatefulWidget {
  const ProductList({super.key});
  @override
  State<ProductList> createState() => _ProductListState();
}

class _ProductListState extends State<ProductList> {
  final List<Product> products = [
    Product('Headphones', 1999, 4.5, 'https://picsum.photos/id/1/200'),
    Product('Smart Watch', 2999, 4.2, 'https://picsum.photos/id/20/200'),
    Product('Backpack', 1299, 4.0, 'https://picsum.photos/id/30/200'),
    Product('Sunglasses', 799, 3.8, 'https://picsum.photos/id/40/200'),

  int cartCount = 0;

  void addToCart(Product p) {
    setState(() => cartCount++);
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text('${p.name} added to cart')),

  @override
  Widget build(BuildContext context) {

      appBar: AppBar(

          Padding(

        itemCount: products.length,

                onPressed: () => addToCart(p),
                child: const Text('Add to Cart'),
              ),
            ),

        },
      ),
    );

<script type="text/plain" class="code" data-id="p8" data-title="8. Student Registration Form with Validation (Flutter)" data-file="registration_form_main.dart" data-note="Use as lib/main.dart">
import 'package:flutter/material.dart';

void main() => runApp(const MaterialApp(
      debugShowCheckedModeBanner: false,
      home: RegistrationForm(),
    ));

class RegistrationForm extends StatefulWidget {
  const RegistrationForm({super.key});
  @override
  State<RegistrationForm> createState() => _RegistrationFormState();
}

class _RegistrationFormState extends State<RegistrationForm> {
  final _formKey = GlobalKey<FormState>();
  final nameC = TextEditingController();
  final emailC = TextEditingController();
  final phoneC = TextEditingController();
  final passC = TextEditingController();

  void submit() {
    if (_formKey.currentState!.validate()) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('Registered: ${nameC.text}')),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Student Registration')),
      body: Padding(
        padding: const EdgeInsets.all(16),
        child: Form(
          key: _formKey,
          child: ListView(
            children: [
              TextFormField(
                controller: nameC,
                decoration: const InputDecoration(
                    labelText: 'Name', border: OutlineInputBorder()),
                validator: (v) =>
                    (v == null || v.trim().isEmpty) ? 'Enter your name' : null,
              ),
              const SizedBox(height: 16),
              TextFormField(
                controller: emailC,
                keyboardType: TextInputType.emailAddress,
                decoration: const InputDecoration(
                    labelText: 'Email', border: OutlineInputBorder()),
                validator: (v) {
                  if (v == null || v.isEmpty) return 'Enter your email';
                  if (!RegExp(r'^[^@\s]+@[^@\s]+\.[^@\s]+$').hasMatch(v)) {
                    return 'Enter a valid email';
                  }
                  return null;
                },
              ),
              const SizedBox(height: 16),
              TextFormField(
                controller: phoneC,
                keyboardType: TextInputType.phone,
                decoration: const InputDecoration(
                    labelText: 'Phone', border: OutlineInputBorder()),
                validator: (v) {
                  if (v == null || v.isEmpty) return 'Enter phone number';
                  if (!RegExp(r'^[0-9]{10}$').hasMatch(v)) {
                    return 'Phone must be 10 digits';
                  }
                  return null;
                },
              ),
              const SizedBox(height: 16),
              TextFormField(
                controller: passC,
                obscureText: true,
                decoration: const InputDecoration(
                    labelText: 'Password', border: OutlineInputBorder()),
                validator: (v) {
                  if (v == null || v.isEmpty) return 'Enter a password';
                  if (v.length < 6) return 'Minimum 6 characters';
                  return null;
                },
              ),
              const SizedBox(height: 24),
              ElevatedButton(onPressed: submit, child: const Text('Register')),
            ],
          ),
        ),
      ),
    );
  }
}
</script>

<script>
(function () {
  var list = document.getElementById('list');
  var nav = document.getElementById('nav');

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function flash(btn, msg) {
    var old = btn.textContent;
    btn.textContent = msg;
    btn.classList.add('done');
    setTimeout(function () { btn.textContent = old; btn.classList.remove('done'); }, 1500);
  }

  document.querySelectorAll('script.code').forEach(function (s) {
    var code = s.textContent.replace(/^\n/, '').replace(/\s+$/, '') + '\n';
    var id = s.dataset.id, title = s.dataset.title, file = s.dataset.file, note = s.dataset.note;

    var a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = title.split('(')[0].trim();
    nav.appendChild(a);

    var sec = document.createElement('section');
    sec.id = id;

    var head = document.createElement('div');
    head.className = 'head';
    var left = document.createElement('div');
    var h2 = document.createElement('h2'); h2.textContent = title;
    var small = document.createElement('small'); small.textContent = file + ' - ' + note;
    left.appendChild(h2); left.appendChild(small);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var copy = document.createElement('button');
    copy.textContent = 'Copy';
    copy.addEventListener('click', function () {
      copyText(code).then(function () { flash(copy, 'Copied'); },
                          function () { flash(copy, 'Failed'); });
    });

    var dl = document.createElement('button');
    dl.className = 'primary';
    dl.textContent = 'Download';
    dl.addEventListener('click', function () {
      var blob = new Blob([code], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = file;
      document.body.appendChild(link); link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 500);
      flash(dl, 'Saved');
    });

    actions.appendChild(copy); actions.appendChild(dl);
    head.appendChild(left); head.appendChild(actions);

    var pre = document.createElement('pre');
    var c = document.createElement('code');
    c.textContent = code;
    pre.appendChild(c);

    sec.appendChild(head); sec.appendChild(pre);
    list.appendChild(sec);
  });
})();
</script>
